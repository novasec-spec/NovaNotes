<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Notification Dashboard 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #FF6B9D;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .token-display {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px solid #FF6B9D;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #FF6B9D;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: #FF6B9D;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            width: 100%;
        }
        
        button:hover {
            background: #ff4d82;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .template-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .template-btn {
            background: #f0f0f0;
            color: #333;
            font-size: 14px;
            padding: 10px;
        }
        
        .template-btn:hover {
            background: #e0e0e0;
        }
        
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .action-buttons {
            margin-top: 15px;
            border-top: 1px solid #e0e0e0;
            padding-top: 15px;
        }
        
        .action-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .action-checkbox input {
            width: auto;
        }
        
        .action-list {
            margin-top: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .action-item {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }
        
        .action-item input {
            flex: 1;
        }
        
        .remove-action {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: auto;
        }
        
        .add-action {
            background: #4CAF50;
            margin-top: 10px;
        }
        
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>💕 Love Notification Dashboard</h1>
            <p class="subtitle">Send beautiful messages to your girlfriend</p>
            
            <div class="token-display">
                <strong>📱 Expo Token:</strong><br>
                ExponentPushToken[ON1vWbHDhaPy8gY_g0XBPj]
            </div>
            
            <div class="input-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="e.g., Thinking of You 💕" value="💕 Love Message">
            </div>
            
            <div class="input-group">
                <label>Message</label>
                <textarea id="body" placeholder="Your message here...">I was just thinking about you! Hope you're having a beautiful day 💕</textarea>
            </div>
            
            <div class="action-checkbox">
                <input type="checkbox" id="enableActions">
                <label style="margin: 0">Add Action Buttons (Reply, Love, Snooze)</label>
            </div>
            
            <div id="actionsContainer" style="display: none;">
                <div class="action-list">
                    <div class="action-item">
                        <input type="text" placeholder="Button 1" id="action1" value="💬 Reply">
                    </div>
                    <div class="action-item">
                        <input type="text" placeholder="Button 2" id="action2" value="❤️ Love">
                    </div>
                    <div class="action-item">
                        <input type="text" placeholder="Button 3" id="action3" value="⏰ Snooze">
                    </div>
                </div>
            </div>
            
            <div class="input-group">
                <label>Schedule (minutes from now, optional)</label>
                <input type="number" id="scheduleMinutes" placeholder="Leave empty to send now" min="1" max="4320">
            </div>
            
            <button id="sendBtn">📤 Send Notification</button>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="card">
            <h3>🎨 Quick Templates</h3>
            <div class="template-buttons">
                <button class="template-btn" onclick="loadTemplate('love')">💕 Love</button>
                <button class="template-btn" onclick="loadTemplate('morning')">🌅 Good Morning</button>
                <button class="template-btn" onclick="loadTemplate('night')">🌙 Good Night</button>
                <button class="template-btn" onclick="loadTemplate('question')">❓ Question</button>
                <button class="template-btn" onclick="loadTemplate('reminder')">⏰ Reminder</button>
                <button class="template-btn" onclick="loadTemplate('encouragement')">💪 Encouragement</button>
            </div>
        </div>
        
        <div class="card">
            <h3>📊 Scheduled Notifications</h3>
            <div id="scheduledList">
                <p style="color: #999; text-align: center;">No scheduled notifications</p>
            </div>
        </div>
    </div>
    
    <script>
        const TOKEN = "ExponentPushToken[ON1vWbHDhaPy8gY_g0XBPj]";
        const API_URL = "https://exp.host/--/api/v2/push/send";
        
        let scheduledNotifications = [];
        
        document.getElementById('enableActions').addEventListener('change', (e) => {
            document.getElementById('actionsContainer').style.display = e.target.checked ? 'block' : 'none';
        });
        
        document.getElementById('sendBtn').addEventListener('click', sendNotification);
        
        function loadTemplate(type) {
            const templates = {
                love: {
                    title: "💕 Thinking of You",
                    body: "You crossed my mind and made me smile. Hope you're having a beautiful day! Sending you virtual hugs 🤗"
                },
                morning: {
                    title: "🌅 Good Morning Sunshine!",
                    body: "Rise and shine, beautiful! Today is full of possibilities. Remember how amazing you are! 💪"
                },
                night: {
                    title: "🌙 Sweet Dreams, My Love",
                    body: "May your dreams be as sweet as you are. Can't wait to see you tomorrow. Good night! 💤"
                },
                question: {
                    title: "💭 Daily Question",
                    body: "What's one thing that made you smile today? I'd love to hear about it! 💕"
                },
                reminder: {
                    title: "⏰ Gentle Reminder",
                    body: "Don't forget to take a break and do something nice for yourself today. You deserve it! ✨"
                },
                encouragement: {
                    title: "💪 You've Got This!",
                    body: "Whatever you're facing right now, I believe in you. You're stronger than you think! 🦁"
                }
            };
            
            const template = templates[type];
            if (template) {
                document.getElementById('title').value = template.title;
                document.getElementById('body').value = template.body;
            }
        }
        
        async function sendNotification() {
            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;
            const enableActions = document.getElementById('enableActions').checked;
            const scheduleMinutes = document.getElementById('scheduleMinutes').value;
            
            if (!title || !body) {
                showStatus('Please enter both title and message', 'error');
                return;
            }
            
            const payload = {
                to: TOKEN,
                title: title,
                body: body,
                sound: "default",
                badge: 1,
                data: {
                    type: "manual_notification",
                    timestamp: new Date().toISOString()
                }
            };
            
            // Add action buttons if enabled
            if (enableActions) {
                const actions = [];
                const action1 = document.getElementById('action1')?.value;
                const action2 = document.getElementById('action2')?.value;
                const action3 = document.getElementById('action3')?.value;
                
                if (action1) actions.push({ identifier: "ACTION_1", buttonTitle: action1 });
                if (action2) actions.push({ identifier: "ACTION_2", buttonTitle: action2 });
                if (action3) actions.push({ identifier: "ACTION_3", buttonTitle: action3 });
                
                if (actions.length > 0) {
                    payload.categoryIdentifier = "love_actions";
                    payload._category = "love_actions";
                    payload.actions = actions;
                }
            }
            
            // Handle scheduling
            if (scheduleMinutes && parseInt(scheduleMinutes) > 0) {
                const minutes = parseInt(scheduleMinutes);
                const scheduleTime = Date.now() + (minutes * 60 * 1000);
                
                scheduledNotifications.push({
                    id: Date.now(),
                    title: title,
                    body: body,
                    scheduleTime: scheduleTime,
                    payload: payload
                });
                
                saveScheduledNotifications();
                updateScheduledList();
                
                // Schedule the actual send
                setTimeout(async () => {
                    await sendToExpo(payload);
                    scheduledNotifications = scheduledNotifications.filter(n => n.id !== this.id);
                    saveScheduledNotifications();
                    updateScheduledList();
                }, minutes * 60 * 1000);
                
                showStatus(`✅ Notification scheduled for ${minutes} minute(s) from now`, 'success');
            } else {
                await sendToExpo(payload);
            }
        }
        
        async function sendToExpo(payload) {
            try {
                showStatus('📡 Sending notification...', 'success');
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.data && result.data.status === 'ok') {
                    showStatus('✅ Notification sent successfully! Your phone should receive it shortly.', 'success');
                } else if (result.errors) {
                    showStatus(`❌ Error: ${result.errors[0]?.message || 'Unknown error'}`, 'error');
                } else {
                    showStatus(`❌ Unexpected response: ${JSON.stringify(result)}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 5000);
        }
        
        function saveScheduledNotifications() {
            localStorage.setItem('scheduledNotifications', JSON.stringify(scheduledNotifications));
        }
        
        function loadScheduledNotifications() {
            const saved = localStorage.getItem('scheduledNotifications');
            if (saved) {
                scheduledNotifications = JSON.parse(saved);
                updateScheduledList();
            }
        }
        
        function updateScheduledList() {
            const container = document.getElementById('scheduledList');
            if (scheduledNotifications.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center;">No scheduled notifications</p>';
                return;
            }
            
            container.innerHTML = scheduledNotifications.map(n => `
                <div style="background: #f5f5f5; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <strong>${n.title}</strong><br>
                    <small>${n.body.substring(0, 50)}...</small><br>
                    <small style="color: #666;">Sends at: ${new Date(n.scheduleTime).toLocaleString()}</small>
                </div>
            `).join('');
        }
        
        // Load saved scheduled notifications
        loadScheduledNotifications();
    </script>
</body>
</html>
