name: Build Android APK and Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Xmx6g
        -XX:MaxMetaspaceSize=2g
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_LIVEKIT_URL=${{ secrets.EXPO_PUBLIC_LIVEKIT_URL }}" >> .env

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_UPDATES_CHANNEL: production

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Build release APK (armeabi-v7a)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: novanotes-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Compute next release tag
        id: next_tag
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let latestTag = null;
            try {
              const latest = await github.rest.repos.getLatestRelease({ owner, repo });
              latestTag = latest.data.tag_name;
            } catch (err) {
              // no latest release
              latestTag = null;
            }
            let nextTag = 'v1';
            if (!latestTag) {
              nextTag = 'v1';
            } else {
              const m = latestTag.match(/^v(\d+)$/);
              if (m) {
                nextTag = 'v' + (parseInt(m[1], 10) + 1);
              } else if (/^v?\d+\.\d+\.\d+/.test(latestTag)) {
                const parts = latestTag.replace(/^v/, '').split('.');
                parts[2] = String((parseInt(parts[2] || '0', 10) + 1));
                nextTag = 'v' + parts.join('.');
              } else {
                // fallback - append -1
                nextTag = latestTag + '-1';
              }
            }
            core.setOutput('tag', nextTag);

      - name: Create GitHub release and upload APKs
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.next_tag.outputs.tag }}
          name: Release ${{ steps.next_tag.outputs.tag }}
          files: 'android/app/build/outputs/apk/release/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log release info
        run: echo "Created release ${{ steps.next_tag.outputs.tag }} and uploaded APK(s)."
